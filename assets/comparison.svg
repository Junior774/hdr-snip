<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1017"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="319" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="28" y="34" fill="#F8FAFC" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Windows HDR Screenshot Comparison</text>
  <text x="872" y="34" text-anchor="end" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">HDR ON · SDR White Level = 240 nits (3.00x)</text>

  <!-- Panel 1: Legacy GDI / Lightshot -->
  <g transform="translate(24, 52)">
    <rect width="268" height="244" rx="12" fill="#181C24" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="14" y="24" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Legacy Tools (BitBlt / Lightshot)</text>
    <rect x="14" y="34" width="132" height="20" rx="10" fill="#EF4444" fill-opacity="0.18" stroke="#F87171" stroke-opacity="0.4"/>
    <text x="80" y="48" text-anchor="middle" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Blown-out / Clipped</text>

    <rect x="14" y="66" width="240" height="122" rx="8" fill="#FFFFFF"/>
    <rect x="26" y="80" width="96" height="10" rx="5" fill="#F1F5F9"/>
    <rect x="26" y="100" width="212" height="8" rx="4" fill="#F8FAFC"/>
    <rect x="26" y="116" width="188" height="8" rx="4" fill="#F8FAFC"/>
    <rect x="26" y="138" width="70" height="24" rx="6" fill="#E0F2FE"/>
    <text x="61" y="154" text-anchor="middle" fill="#BAE6FD" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Medium</text>
    <rect x="104" y="138" width="70" height="24" rx="6" fill="#FEF3C7"/>
    <text x="139" y="154" text-anchor="middle" fill="#FDE68A" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Pending</text>

    <text x="14" y="208" fill="#94A3B8" font-family="Consolas, monospace" font-size="10.5">White: #FFFFFF (8.3% clipped)</text>
    <text x="14" y="226" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11">Bright UI badges &amp; borders vanish</text>
  </g>

  <!-- Panel 2: Windows Snipping Tool HDR Corrector -->
  <g transform="translate(316, 52)">
    <rect width="268" height="244" rx="12" fill="#181C24" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="14" y="24" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Snipping Tool (HDR Corrector)</text>
    <rect x="14" y="34" width="152" height="20" rx="10" fill="#F59E0B" fill-opacity="0.18" stroke="#FBBF24" stroke-opacity="0.4"/>
    <text x="90" y="48" text-anchor="middle" fill="#FCD34D" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Crushed to Muddy Gray</text>

    <rect x="14" y="66" width="240" height="122" rx="8" fill="#DFDCD6"/>
    <rect x="26" y="80" width="96" height="10" rx="5" fill="#8C8982"/>
    <rect x="26" y="100" width="212" height="8" rx="4" fill="#B5B2AA"/>
    <rect x="26" y="116" width="188" height="8" rx="4" fill="#C4C1B9"/>
    <rect x="26" y="138" width="70" height="24" rx="6" fill="#9AB8C9"/>
    <text x="61" y="154" text-anchor="middle" fill="#3B5463" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Medium</text>
    <rect x="104" y="138" width="70" height="24" rx="6" fill="#CBB68A"/>
    <text x="139" y="154" text-anchor="middle" fill="#5D4D2E" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Pending</text>

    <text x="14" y="208" fill="#94A3B8" font-family="Consolas, monospace" font-size="10.5">White: #E3E0DB (~224 gray)</text>
    <text x="14" y="226" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11">Global tone-map dulls every white page</text>
  </g>

  <!-- Panel 3: HDR Snip -->
  <g transform="translate(608, 52)">
    <rect width="268" height="244" rx="12" fill="#131920" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="14" y="24" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">HDR Snip (FP16 scRGB → sRGB)</text>
    <rect x="14" y="34" width="150" height="20" rx="10" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-opacity="0.5"/>
    <text x="89" y="48" text-anchor="middle" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Exact #FFFFFF &amp; Colors</text>

    <!-- Bright cropped window + corner brackets -->
    <rect x="14" y="66" width="240" height="106" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <path d="M14 77 V66 H25 M243 66 H254 V77 M14 161 V172 H25 M243 172 H254 V161" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square"/>
    <rect x="26" y="79" width="96" height="10" rx="5" fill="#1E293B"/>
    <rect x="26" y="98" width="212" height="8" rx="4" fill="#94A3B8"/>
    <rect x="26" y="113" width="188" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="26" y="132" width="70" height="24" rx="6" fill="#0284C7"/>
    <text x="61" y="148" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Medium</text>
    <rect x="104" y="132" width="70" height="24" rx="6" fill="#D97706"/>
    <text x="139" y="148" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Pending</text>

    <!-- Keycap Minimal Floating Toolbar -->
    <g transform="translate(22, 180)" filter="url(#shadow)">
      <rect width="232" height="32" rx="9" fill="#111317" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <rect x="4" y="4" width="74" height="24" rx="6" fill="#059669"/>
      <text x="14" y="20" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Copy</text>
      <rect x="52" y="8" width="20" height="16" rx="4" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.3"/>
      <text x="62" y="19.5" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, monospace" font-size="9.5">↵</text>

      <text x="90" y="20" fill="#ECEFF4" font-family="Segoe UI, sans-serif" font-size="10">Save</text>
      <rect x="118" y="8" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="126" y="19.5" text-anchor="middle" fill="#CBD5E1" font-family="Consolas, monospace" font-size="9.5">S</text>

      <text x="144" y="20" fill="#ECEFF4" font-family="Segoe UI, sans-serif" font-size="10">Full</text>
      <rect x="166" y="8" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="174" y="19.5" text-anchor="middle" fill="#CBD5E1" font-family="Consolas, monospace" font-size="9.5">F</text>

      <line x1="190" y1="8" x2="190" y2="24" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <rect x="198" y="8" width="26" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="211" y="19.5" text-anchor="middle" fill="#CBD5E1" font-family="Consolas, monospace" font-size="9">Esc</text>
    </g>

    <text x="14" y="232" fill="#6EE7B7" font-family="Consolas, monospace" font-size="10.5">White: #FFFFFF · 0.06% clip · ~374 KB</text>
  </g>
</svg>
